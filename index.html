<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易经战略智库</title>
    <style>
        :root {
            --bg: #f5f1e7;
            --text-main: #2b2723;
            --text-light: #70665c;
            --accent: #8e291c;
            --border: #d4cbb8;
            --card-bg: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: "Noto Serif SC", STSong, "Source Han Serif SC", "Times New Roman", serif;
            background-color: var(--bg);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.04"/></svg>');
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 15px 35px rgba(43, 39, 35, 0.05);
            border-radius: 6px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid var(--border);
            pointer-events: none;
        }
        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 500;
            letter-spacing: 8px;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-light);
            margin-bottom: 30px;
            font-family: sans-serif;
            text-transform: uppercase;
        }
        .input-box {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            font-size: 17px;
            font-family: inherit;
            text-align: center;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
            margin-bottom: 30px;
        }
        .input-box:focus {
            border-bottom-color: var(--accent);
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            letter-spacing: 6px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }
        
        .status-msg {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }
        .status-loading { color: var(--text-light); font-style: italic; letter-spacing: 2px; }
        .status-error { color: var(--accent); font-weight: bold; background: rgba(142, 41, 28, 0.1); padding: 10px; border-radius: 4px; }

        .result-panel {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .hexagram-visual { text-align: center; margin-bottom: 30px; }
        .hex-symbol { font-size: 80px; line-height: 1; color: var(--text-main); margin-bottom: 10px; font-family: "Segoe UI Symbol", "Apple Symbols", serif; }
        .hex-title { font-size: 24px; font-weight: bold; color: var(--accent); letter-spacing: 2px; margin-bottom: 5px; }
        .hex-line { font-size: 14px; color: var(--text-light); }

        .content-card {
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .card-label {
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--bg);
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .classic-text { font-size: 18px; font-weight: bold; color: var(--text-main); margin-top: 10px; margin-bottom: 8px; }
        .classic-desc { font-size: 15px; color: var(--text-light); line-height: 1.6; text-align: justify; }
        .strategy-text { font-size: 16px; color: var(--text-main); line-height: 1.8; text-align: justify; margin-top: 10px; }
        .strategy-text p { margin-bottom: 1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>易经战略智库</h1>
    <div class="subtitle">I-Ching Strategic Analysis</div>

    <input type="text" id="user-question" class="input-box" placeholder="请输入当下的决策困局..." autocomplete="off">
    <button class="btn" onclick="castAndAnalyze()">诚心起卦</button>

    <div id="status-box" class="status-msg"></div>

    <div id="result-panel" class="result-panel">
        <div class="hexagram-visual">
            <div class="hex-symbol" id="hex-symbol">䷀</div>
            <div class="hex-title" id="hex-title">【乾为天】</div>
            <div class="hex-line" id="hex-line">变爻：第 1 爻</div>
        </div>

        <div class="content-card">
            <div class="card-label">判大局 · 卦辞</div>
            <div class="classic-text" id="gua-ci"></div>
            <div class="classic-desc" id="gua-ci-desc"></div>
        </div>

        <div class="content-card">
            <div class="card-label">观变数 · 爻辞</div>
            <div class="classic-text" id="yao-ci"></div>
            <div class="classic-desc" id="yao-ci-desc"></div>
        </div>

        <div class="content-card" style="border-color: var(--accent);">
            <div class="card-label" style="background: var(--accent); color: #fff; border:none;">智库 · 现实解码</div>
            <div class="strategy-text" id="strategy-content"></div>
        </div>
    </div>
</div>

<script>
    const hexagrams = [
        "乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比",
        "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫",
        "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复",
        "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒",
        "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解",
        "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井",
        "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅",
        "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"
    ];

    function showStatus(msg, isError = false) {
        const box = document.getElementById('status-box');
        box.style.display = 'block';
        box.className = isError ? 'status-msg status-error' : 'status-msg status-loading';
        box.innerHTML = msg;
    }

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        if (!question.trim()) {
            showStatus("心诚则灵，请先在上方输入您的困局或问题。", true);
            return;
        }

        document.getElementById('result-panel').style.display = 'none';
        showStatus("易理验算中，正在调取先贤智慧，请稍候...");

        const index = Math.floor(Math.random() * 64);
        const name = hexagrams[index];
        const line = Math.floor(Math.random() * 6) + 1;
        const symbol = String.fromCodePoint(0x4DC0 + index);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { 
                            role: "system", 
                            content: `你是一位精通《易经》的国学大师与战略智库。请严格输出一段合法的 JSON 格式数据。JSON 必须包含以下5个字段：
1. "gua_ci": "该卦的卦辞原文"
2. "gua_ci_desc": "卦辞的白话翻译"
3. "yao_ci": "该变爻的爻辞原文"
4. "yao_ci_desc": "爻辞的白话翻译"
5. "strategy": "结合用户问题的现代战略推演(使用<p>分段)"`
                        },
                        { role: "user", content: `卦象：【${name}】，变爻：第 ${line} 爻。现实问题：${question}` }
                    ]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error?.message || "后端接口访问异常");
            }

            let rawText = data.choices[0].message.content;
            let jsonString = "";
            
            const startIndex = rawText.indexOf('{');
            const endIndex = rawText.lastIndexOf('}');
            
            if (startIndex !== -1 && endIndex !== -1 && endIndex >= startIndex) {
                jsonString = rawText.substring(startIndex, endIndex + 1);
            } else {
                throw new Error("大模型未能返回有效的数据格式。");
            }

            const result = JSON.parse(jsonString);

            // 填充 UI
            document.getElementById('hex-symbol').innerText = symbol;
            document.getElementById('hex-title').innerText = `【${name}】`;
            document.getElementById('hex-line').innerText = `变爻：第 ${line} 爻`;

            document.getElementById('gua-ci').innerText = result.gua_ci || "暂无";
            document.getElementById('gua-ci-desc').innerText = result.gua_ci_desc || "暂无";
            document.getElementById('yao-ci').innerText = result.yao_ci || "暂无";
            document.getElementById('yao-ci-desc').innerText = result.yao_ci_desc || "暂无";
            document.getElementById('strategy-content').innerHTML = result.strategy || "暂无";

            document.getElementById('status-box').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';

        } catch (e) {
            console.error(e);
            showStatus(`推演中断。<br>原因：${e.message}<br>请确保后台API Key配置正确。`, true);
        }
    }
</script>
</body>
</html>
