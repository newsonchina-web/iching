<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易鼎战略 | 东方决策智库</title>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #05070a; --text-main: #d1c5b4; --text-dim: #8c857a;
            --gold: #d4af37; --glass-bg: rgba(15, 20, 25, 0.8); --glass-border: rgba(212, 175, 55, 0.3);
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-dark); font-family: "Noto Serif SC", STSong, "Source Han Serif SC", serif;
            color: var(--text-main); overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .wrapper {
            position: relative; z-index: 10; max-width: 640px; width: 100%;
            padding: 40px 20px 120px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 38px; font-weight: normal; letter-spacing: 14px; margin: 0 0 10px 14px; color: var(--gold); }
        .header .stamp { font-size: 12px; letter-spacing: 6px; color: var(--text-dim); }

        .control-panel {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 30px; box-sizing: border-box; margin-bottom: 40px;
        }
        
        .input-box {
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background: transparent; font-size: 16px; font-family: inherit; text-align: center; color: #fff; outline: none; margin-bottom: 30px;
        }
        .input-box:focus { border-bottom-color: var(--gold); }

        .btn {
            display: block; width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 15px; font-size: 16px; letter-spacing: 8px; text-indent: 8px; border-radius: 4px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover:not(:disabled) { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        .result-panel { width: 100%; display: none; margin-bottom: 50px;}
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 4px; padding: 25px; margin-bottom: 20px; }
        .card-title { font-size: 16px; color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 10px; }
        .classic-quote { font-size: 18px; color: #fff; margin-bottom: 10px; }
        .strategy-content { font-size: 16px; color: var(--text-main); line-height: 2; text-align: justify; }

        /* 海报模板布局 */
        #share-card-template {
            position: absolute; left: -9999px; top: -9999px; 
            width: 800px; background: #05070a; color: #d1c5b4; 
            display: none; flex-direction: column; align-items: center;
        }
        
        .poster-hero { width: 100%; height: auto; display: block; }
        .poster-body { padding: 50px 60px; width: 100%; box-sizing: border-box; }
        
        .poster-header { text-align: center; margin-bottom: 40px; }
        .poster-title { font-size: 60px; letter-spacing: 24px; color: #fff; margin-bottom: 10px; font-weight: bold; }
        .poster-sub { font-size: 22px; color: #d4af37; letter-spacing: 10px; margin-bottom: 20px;}
        
        .poster-gua-section { text-align: center; margin-bottom: 40px; border-top: 1px solid rgba(212,175,55,0.2); border-bottom: 1px solid rgba(212,175,55,0.2); padding: 30px 0;}
        .poster-gua-name { font-size: 36px; color: #fff; letter-spacing: 8px; margin-bottom: 10px;}
        .poster-gua-yao { font-size: 20px; color: #d4af37; }

        .poster-box { width: 100%; border: 1px solid rgba(212,175,55,0.3); padding: 35px; margin-bottom: 30px; background: rgba(20,25,35,0.5); }
        .poster-box-label { font-size: 18px; color: #d4af37; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; border-left: 4px solid #d4af37; padding-left: 15px;}
        .poster-quote-text { font-size: 22px; color: #fff; margin-bottom: 15px; line-height: 1.6; }
        .poster-main-text { font-size: 19px; color: #e6dfd3; line-height: 2; text-align: justify; }

        .poster-footer { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 40px; border-top: 2px solid #d4af37; }
        .footer-left { display: flex; flex-direction: column; align-items: flex-start; }
        .footer-slogan { font-size: 22px; color: #fff; letter-spacing: 4px; margin-bottom: 10px; font-weight: bold;}
        .footer-url { font-size: 16px; color: #d4af37; font-family: sans-serif; }
        
        .qr-box { padding: 12px; background: #fff; border-radius: 4px; box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .qr-canvas { width: 140px !important; height: 140px !important; display: block; }

        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-content { max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center; }
        #final-share-image { max-width: 100%; max-height: 85vh; border: 1px solid var(--gold); }
        .close-modal-btn { position: absolute; top: -50px; right: 0; color: #fff; background: none; border: 1px solid #fff; padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<!-- 史诗海报模板 -->
<div id="share-card-template">
    <img id="poster-hero-img" src="" class="poster-hero" crossorigin="anonymous">
    <div class="poster-body">
        <div class="poster-header">
            <div class="poster-title">易鼎戰略</div>
            <div class="poster-sub">YIDING STRATEGY · 东方战略智库</div>
        </div>

        <div class="poster-gua-section">
            <div class="poster-gua-name" id="tmpl-gua-name">兑为泽</div>
            <div class="poster-gua-yao" id="tmpl-yao-name">爻位：初九</div>
        </div>

        <div class="poster-box">
            <div class="poster-box-label">大局 · 卦辞</div>
            <div class="poster-quote-text" id="tmpl-gua-ci"></div>
            <div class="poster-main-text" id="tmpl-gua-ci-desc"></div>
        </div>
        
        <div class="poster-box">
            <div class="poster-box-label">变数 · 爻辞</div>
            <div class="poster-quote-text" id="tmpl-yao-ci"></div>
            <div class="poster-main-text" id="tmpl-yao-ci-desc"></div>
        </div>
        
        <div class="poster-box" style="border-color: #d4af37; background: rgba(212,175,55,0.05);">
            <div class="poster-box-label" style="background: #d4af37; color: #000; padding-right: 10px;">降维定局推演</div>
            <div class="poster-main-text" id="tmpl-strategy-block"></div>
        </div>

        <div class="poster-footer">
            <div class="footer-left">
                <div class="footer-slogan">一窥天演，智定鼎局。</div>
                <div class="footer-slogan" style="font-size:16px; color:#8c857a; font-weight:normal;">链接高维智慧 · 掌控绝对变局</div>
                <div class="footer-url">www.yishu-strategy.com</div>
            </div>
            <div class="qr-box">
                <canvas id="tmpl-qrcode-canvas" class="qr-canvas"></canvas>
            </div>
        </div>
    </div>
</div>

<div id="image-modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="closeModal()">关闭</button>
        <img src="" id="final-share-image">
        <p style="color:#d4af37; margin-top:15px;">长按上方海报，保存并开启定局</p>
    </div>
</div>

<div class="wrapper">
    <div class="header">
        <h1>易鼎战略</h1>
        <div class="stamp">YIDING STRATEGY</div>
    </div>
    <div class="control-panel">
        <input type="text" id="user-question" class="input-box" placeholder="写下您的当下困局..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="castAndAnalyze()">凝神起卦</button>
    </div>
    <div id="status-box" class="status-msg"></div>
    <div id="result-panel" class="result-panel">
        <div class="gua-display">
            <div class="gua-symbol" id="hex-symbol">䷀</div>
            <div class="gua-name" id="hex-title"></div>
            <div class="gua-details" id="hex-line"></div>
        </div>
        <div class="card">
            <div class="card-title">大局 · 卦辞</div>
            <div class="classic-quote" id="gua-ci"></div>
            <div class="classic-explain" id="gua-ci-desc"></div>
        </div>
        <div class="card">
            <div class="card-title">变数 · 爻辞</div>
            <div class="classic-quote" id="yao-ci"></div>
            <div class="classic-explain" id="yao-ci-desc"></div>
        </div>
        <div class="card" style="border-color: #d4af37;">
            <div class="card-title" style="background: #d4af37; color: #000; padding: 5px 10px;">智道 · 战略推演</div>
            <div class="strategy-content" id="strategy-content"></div>
        </div>
    </div>
</div>

<div class="share-control" id="share-control">
    <button class="btn" onclick="generateShareImage()">生成智道定局海报</button>
</div>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    function initCanvas() {
        width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.1, vy: (Math.random() - 0.5) * 0.1, size: Math.random() * 2, alpha: Math.random() * 0.5 });
        }
    }
    function animate() {
        ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, width, height);
        for (let p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx = -p.vx; if (p.y < 0 || p.y > height) p.vy = -p.vy;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`; ctx.fill();
        }
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', initCanvas); initCanvas(); animate();

    const hexagrams = ["乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比", "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫", "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复", "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒", "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解", "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井", "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅", "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"];
    const hexagramBinaries = ["111111", "000000", "100010", "010001", "111010", "010111", "010000", "000010", "111011", "110111", "111000", "000111", "101111", "111101", "001000", "000100", "100110", "011001", "110000", "000011", "100101", "101001", "000001", "100000", "100111", "111001", "100001", "011110", "010010", "101101", "001110", "011100", "001111", "111100", "000101", "101000", "101011", "110101", "001010", "010100", "110001", "100011", "111110", "011111", "000110", "011000", "010110", "011010", "101110", "011101", "100100", "001001", "001011", "110100", "101100", "001101", "011011", "110110", "010011", "110010", "110011", "001100", "101010", "010101"];
    
    function getLineName(binaryStr, lineNumber) {
        const isYang = binaryStr[lineNumber - 1] === '1';
        const yangNames = ["初九", "九二", "九三", "九四", "九五", "上九"];
        const yinNames = ["初六", "六二", "六三", "六四", "六五", "上六"];
        return isYang ? yangNames[lineNumber - 1] : yinNames[lineNumber - 1];
    }

    function parseAIResponse(text) {
        const sections = { gua_ci: "【卦辞】", gua_ci_desc: "【卦辞解析】", yao_ci: "【爻辞】", yao_ci_desc: "【爻辞解析】", strategy: "【战略定局】" };
        let parsed = {}; let keys = Object.keys(sections);
        for(let i=0; i<keys.length; i++) {
            let key = keys[i]; let startTag = sections[key]; let nextTag = i < keys.length - 1 ? sections[keys[i+1]] : null;
            let startIndex = text.indexOf(startTag);
            if (startIndex === -1) { parsed[key] = ""; continue; }
            startIndex += startTag.length;
            let endIndex = nextTag ? text.indexOf(nextTag, startIndex) : text.length;
            if (endIndex === -1) endIndex = text.length;
            let content = text.substring(startIndex, endIndex).trim().replace(/\n/g, '<br>');
            parsed[key] = content;
        }
        return parsed;
    }

    let currentGuaData = null;

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        if (!question.trim()) { alert("请写下您的困局。"); return; }
        const btn = document.getElementById('submit-btn');
        btn.innerText = "高维算力跃迁中..."; btn.disabled = true;
        document.getElementById('status-box').style.display = 'block';
        document.getElementById('status-box').innerText = "硅基引擎启动，正在交汇中西顶尖哲思，推演现实定局...";

        const index = Math.floor(Math.random() * 64); const name = hexagrams[index]; const line = Math.floor(Math.random() * 6) + 1; 
        const symbol = String.fromCodePoint(0x4DC0 + index); const exactLineName = getLineName(hexagramBinaries[index], line);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { 
                            role: "system", 
                            content: `你是一位融合了《周易》象数与全球顶尖战略思想的超级智库大脑。
你的思想库不仅包含：东方古典智慧（老庄天道、王阳明心学、孙子兵法）、西方经典（斯多葛学派、彼得·德鲁克现代管理），更深度融合了当代顶尖商业与科技领袖的底层逻辑：瑞·达利欧（Ray Dalio）的机器与原则周期、纳瓦尔（Naval Ravikant）的财富与杠杆原理、埃隆·马斯克（Elon Musk）的第一性原理、史蒂夫·乔布斯（Steve Jobs）的极致聚焦。

你的解读必须极度深邃、冷峻、直击本质。严禁使用玄乎的算命套话或直白浅显的废话。

输出格式要求（严禁多余的标点或寒暄，严格按5个【】标题输出）：
【卦辞】(输出原文)
【卦辞解析】(解析大局。必须引入达利欧的宏观周期或德鲁克的系统效能等现代视角来解构大环境)
【爻辞】(输出原文)
【爻辞解析】(解析当前变数。必须引入王阳明心学、马斯克的第一性原理或乔布斯的聚焦等微观/个人视角进行剖析)
【战略定局】(这是灵魂！结合用户具体问题，给出3条极具实操性的降维打击策略。在策略中，必须明确点名并化用上述至少2位中外顶尖思想家（如纳瓦尔的杠杆、马斯克的物理学思维、老庄的顺势等）的核心理念，指出破局的最优解。)`
                        },
                        { role: "user", content: `卦象：${name}卦，爻位：${exactLineName}。问题：${question}` }
                    ]
                })
            });

            const data = await response.json();
            const result = parseAIResponse(data.choices[0].message.content);
            currentGuaData = { symbol, name, exactLineName, ...result };

            document.getElementById('hex-symbol').innerText = symbol; 
            document.getElementById('hex-title').innerText = name; 
            document.getElementById('hex-line').innerText = `爻位：${exactLineName}`;
            document.getElementById('gua-ci').innerHTML = result.gua_ci; 
            document.getElementById('gua-ci-desc').innerHTML = result.gua_ci_desc;
            document.getElementById('yao-ci').innerHTML = result.yao_ci; 
            document.getElementById('yao-ci-desc').innerHTML = result.yao_ci_desc;
            document.getElementById('strategy-content').innerHTML = result.strategy;

            document.getElementById('status-box').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('share-control').style.display = 'flex';
            document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth' });

        } catch (e) {
            alert("智道网络暂时中断，请重新起卦。");
        } finally {
            btn.innerText = "凝神起卦"; btn.disabled = false;
        }
    }

    async function generateShareImage() {
        if (!currentGuaData) return;
        const btn = document.querySelector('.share-control .btn');
        btn.innerText = "符文熔铸中..."; btn.disabled = true;

        document.getElementById('poster-hero-img').src = 'hero-bg.jpg?v=' + Date.now();
        
        document.getElementById('tmpl-gua-name').innerText = currentGuaData.name;
        document.getElementById('tmpl-yao-name').innerText = `爻位：${currentGuaData.exactLineName}`;
        document.getElementById('tmpl-gua-ci').innerHTML = currentGuaData.gua_ci;
        document.getElementById('tmpl-gua-ci-desc').innerHTML = currentGuaData.gua_ci_desc;
        document.getElementById('tmpl-yao-ci').innerHTML = currentGuaData.yao_ci;
        document.getElementById('tmpl-yao-ci-desc').innerHTML = currentGuaData.yao_ci_desc;
        document.getElementById('tmpl-strategy-block').innerHTML = currentGuaData.strategy;

        try {
            await QRCode.toCanvas(document.getElementById('tmpl-qrcode-canvas'), 'https://www.yishu-strategy.com/', { width: 140, margin: 1 });
        } catch (err) {}

        const template = document.getElementById('share-card-template');
        template.style.display = 'flex'; 

        try {
            await new Promise(r => setTimeout(r, 600));
            const canvas = await html2canvas(template, { scale: 2, useCORS: true, backgroundColor: '#05070a' });
            document.getElementById('final-share-image').src = canvas.toDataURL('image/png');
            document.getElementById('image-modal').style.display = 'flex';
        } catch (e) {
            alert("生成失败，请确保 hero-bg.jpg 已上传至根目录。");
        } finally {
            template.style.display = 'none'; 
            btn.innerText = "生成智道定局海报"; btn.disabled = false;
        }
    }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
</script>
</body>
</html>
