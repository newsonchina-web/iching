<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易鼎战略 | 东方决策智库</title>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #05070a; --text-main: #d1c5b4; --text-dim: #8c857a;
            --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4);
            --glass-bg: rgba(15, 20, 25, 0.7);
            --glass-border: rgba(212, 175, 55, 0.25);
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-dark); font-family: "Noto Serif SC", STSong, "Source Han Serif SC", serif;
            color: var(--text-main); overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .wrapper {
            position: relative; z-index: 10; max-width: 640px; width: 100%;
            padding: 40px 20px 120px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 40px; margin-top: 2vh; }
        .header h1 {
            font-size: 40px; font-weight: 400; letter-spacing: 12px; margin: 0 0 10px 12px;
            background: linear-gradient(to bottom, #fff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--gold-glow);
        }
        .header .stamp { font-size: 12px; letter-spacing: 6px; color: var(--text-dim); text-transform: uppercase; font-family: sans-serif; position: relative; display: inline-block; }

        .control-panel {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 30px; box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 40px; position: relative;
        }
        
        .input-box {
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background: transparent; font-size: 16px; font-family: inherit;
            text-align: center; color: #fff; outline: none; transition: 0.4s;
            margin-bottom: 30px; letter-spacing: 1px;
        }
        .input-box:focus { border-bottom-color: var(--gold); }
        .input-box::placeholder { color: #5a544d; }

        .btn {
            display: block; width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 16px; font-size: 16px; font-family: inherit; letter-spacing: 12px; text-indent: 12px; border-radius: 4px;
            cursor: pointer; transition: 0.4s; position: relative; overflow: hidden; font-weight: bold;
        }
        .btn:disabled { color: var(--text-dim); border-color: var(--text-dim); cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: rgba(212, 175, 55, 0.15); box-shadow: 0 0 20px var(--gold-glow); }

        .status-msg { text-align: center; font-size: 14px; letter-spacing: 2px; line-height: 2; margin-top: -20px; margin-bottom: 30px; display: none; }
        .status-loading { color: var(--gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--gold-glow); } 100% { opacity: 0.5; } }
        .status-error { color: #ff5252; background: rgba(255, 82, 82, 0.1); padding: 10px; border-radius: 4px; border: 1px solid rgba(255, 82, 82, 0.3); }

        .result-panel { width: 100%; display: none; animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .gua-display { text-align: center; margin-bottom: 40px; }
        .gua-symbol { font-size: 110px; line-height: 1; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: "Segoe UI Symbol", "Apple Symbols", serif; margin-bottom: 10px; filter: drop-shadow(0 0 15px var(--gold-glow)); }
        .gua-name { font-size: 26px; color: var(--text-main); letter-spacing: 4px; margin-bottom: 8px; }
        .gua-details { font-size: 13px; color: var(--gold); letter-spacing: 2px; }

        .card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 4px; padding: 30px 25px; margin-bottom: 25px; position: relative; }
        .card-title { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--bg-dark); padding: 0 15px; font-size: 12px; color: var(--gold); letter-spacing: 4px; border: 1px solid var(--glass-border); border-radius: 20px; }
        .classic-quote { text-align: center; font-size: 20px; color: #fff; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.15); font-weight: 500; }
        .classic-explain { font-size: 15px; color: var(--text-dim); line-height: 1.8; text-align: justify; }
        
        .strategy-card { border-color: rgba(212, 175, 55, 0.5); }
        .strategy-title { background: var(--gold); color: #000; font-weight: bold; }
        .strategy-content { font-size: 16px; color: var(--text-main); line-height: 2; text-align: justify; }
        .strategy-content p { margin-bottom: 1.2em; }
        .strategy-content strong { color: var(--gold); font-weight: normal; border-bottom: 1px dashed var(--gold); padding-bottom: 2px; }

        .share-control { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); padding: 20px; box-sizing: border-box; z-index: 100; display: none; justify-content: center; }

        /* --- V16 宇宙宿命感竖版分享图 (全要素) --- */
        #share-card-template {
            position: absolute; left: -9999px; top: -9999px; 
            width: 800px; /* 竖版高分辨率宽度 */
            padding: 80px 60px 60px 60px; 
            background: linear-gradient(135deg, #05070a 0%, #111522 50%, #05070a 100%);
            color: #d1c5b4; border: 2px solid #3a3225; box-shadow: 0 0 80px rgba(0,0,0,1);
            display: none; flex-direction: column; align-items: center;
            background-image: radial-gradient(circle at 50% 20%, #1a2235 0%, transparent 60%), url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="300" height="300" filter="url(%23noise)" opacity="0.06"/></svg>');
            background-blend-mode: overlay;
        }
        
        .tmpl-header { text-align: center; margin-bottom: 40px; width: 100%; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 30px;}
        .tmpl-title { font-family: "Noto Serif SC", serif; font-size: 56px; letter-spacing: 24px; margin: 0 0 15px 24px; color: #fff; text-shadow: 0 0 30px rgba(212,175,55,0.4); font-weight: normal;}
        .tmpl-slogan { font-size: 18px; color: #d4af37; letter-spacing: 10px; font-family: sans-serif; text-transform: uppercase;}

        .tmpl-gua-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; position: relative;}
        .tmpl-taiji-bg { position: absolute; font-size: 200px; color: rgba(212,175,55,0.05); top: -30px; z-index: 0; }
        .tmpl-gua-symbol { font-size: 130px; font-family: serif; color: #d4af37; line-height: 1; margin-bottom: 15px; text-shadow: 0 0 40px rgba(212,175,55,0.5); z-index: 1;}
        .tmpl-gua-name { font-size: 34px; font-weight: bold; color: #fff; margin-bottom: 10px; letter-spacing: 6px; z-index: 1;}
        .tmpl-yao-name { font-size: 20px; color: #d4af37; letter-spacing: 3px; z-index: 1;}

        .tmpl-content-section { width: 100%; display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; z-index: 1;}
        .tmpl-section-card { border: 1px solid rgba(212,175,55,0.3); padding: 35px 30px; position: relative; background: rgba(20,25,35,0.4); }
        .tmpl-label { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: #0b0e14; padding: 0 20px; font-size: 16px; color: #d4af37; letter-spacing: 4px; border: 1px solid rgba(212,175,55,0.4); border-radius: 20px;}
        .tmpl-card-quote { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 15px; text-align: center; line-height: 1.5; text-shadow: 0 0 10px rgba(255,255,255,0.2);}
        .tmpl-card-desc { font-size: 18px; color: #a59c90; line-height: 1.8; text-align: justify; }

        .tmpl-strategy-box { width: 100%; border: 1px solid #d4af37; padding: 45px 35px 35px 35px; position: relative; background: rgba(212,175,55,0.05); }
        .tmpl-strat-label { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: #d4af37; color: #000; padding: 6px 24px; font-size: 18px; font-weight: bold; letter-spacing: 6px; border-radius: 4px;}
        .tmpl-strat-content { font-size: 20px; color: #e6dfd3; line-height: 2; text-align: justify; }
        .tmpl-strat-content p { margin-bottom: 1.2em; }
        .tmpl-strat-content strong { color: #d4af37; font-weight: normal; border-bottom: 1px solid #d4af37; }

        /* V16 底部艺术区域：文王 vs AI */
        .tmpl-footer-art { 
            width: 100%; display: flex; justify-content: space-between; align-items: center; 
            border-top: 1px solid rgba(212,175,55,0.2); padding-top: 40px; 
        }
        
        .art-side { display: flex; flex-direction: column; align-items: center; width: 160px; opacity: 0.8;}
        .art-icon { width: 60px; height: 60px; margin-bottom: 15px; }
        .art-text-main { font-size: 16px; color: #d4af37; letter-spacing: 4px; margin-bottom: 5px; font-weight: bold;}
        .art-text-sub { font-size: 12px; color: #8c857a; letter-spacing: 2px;}

        .qr-center { display: flex; flex-direction: column; align-items: center; }
        .qr-frame { padding: 12px; border: 2px solid #d4af37; border-radius: 4px; background: #fff; position: relative; margin-bottom: 15px; }
        .qr-frame::before, .qr-frame::after { content: ''; position: absolute; width: 20px; height: 20px; border-color: #d4af37; border-style: solid; }
        .qr-frame::before { top: -8px; left: -8px; border-width: 3px 0 0 3px; }
        .qr-frame::after { bottom: -8px; right: -8px; border-width: 0 3px 3px 0; }
        .tmpl-qrcode-canvas { width: 130px !important; height: 130px !important; display: block;}
        
        .qr-center p { font-size: 14px; color: #a59c90; margin: 0; letter-spacing: 3px; text-transform: uppercase;}
        .qr-center .url-text { font-size: 12px; color: #d4af37; font-family: monospace; margin-top: 8px; letter-spacing: 1px;}

        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 1000; display: none; justify-content: center; align-items: center; opacity: 0; animation: fadeInModal 0.4s forwards; }
        @keyframes fadeInModal { to { opacity: 1; } }
        .modal-content { max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center; position: relative; }
        #final-share-image { max-width: 100%; max-height: 80vh; box-shadow: 0 0 60px rgba(212,175,55,0.25); border: 1px solid rgba(212,175,55,0.6); border-radius: 8px; object-fit: contain; }
        .modal-tip { color: #d4af37; margin-top: 25px; font-size: 15px; letter-spacing: 3px; text-shadow: 0 0 5px rgba(0,0,0,1); font-weight: bold;}
        .close-modal-btn { position: absolute; top: -50px; right: 0; background: rgba(212,175,55,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 25px; cursor: pointer; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<!-- --- V16 宿命感竖版分享图模版 --- -->
<div id="share-card-template">
    <div class="tmpl-header">
        <h2 class="tmpl-title">易鼎战略</h2>
        <div class="tmpl-slogan">一窥天演，智定鼎局。</div>

    <div class="tmpl-gua-wrap">

        <div class="tmpl-gua-symbol" id="tmpl-gua-symbol">䷀</div>

    <div class="tmpl-content-section">

        <div class="tmpl-strategy-box">

    <div class="tmpl-footer-art">
        <!-- 左侧：代表周文王古智 (以竹简与卦盘意象呈现) -->
        <div class="art-side">
            <svg class="art-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="#d4af37" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M30 20 H70 M30 50 H70 M30 80 H70" stroke="#d4af37" stroke-width="3"/>
                <path d="M40 20 V80 M60 20 V80" stroke="#d4af37" stroke-width="1"/>

        <!-- 中间：二维码 -->
        <div class="qr-center">

        </div>

        <!-- 右侧：代表高维AI算力 (以神经网络与核心意象呈现) -->
        <div class="art-side">
            <svg class="art-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" stroke="#d4af37" stroke-width="2"/>
                <circle cx="50" cy="50" r="15" stroke="#d4af37" stroke-width="2"/>
                <path d="M50 10 L50 35 M90 30 L63 42 M90 70 L63 58 M50 90 L50 65 M10 70 L37 58 M10 30 L37 42" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
                <circle cx="50" cy="50" r="5" fill="#d4af37"/>
            </svg>
            <div class="art-text-main">硅基引擎</div>
            <div class="art-text-sub">高维算力·推演</div>
        </div>
    </div>
</div>

<div id="image-modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="closeModal()">关闭预览</button>
        <img src="" alt="分享图预览" id="final-share-image">
        <div class="modal-tip">長按上方海報 · 選擇「保存圖片」至相冊</div>
    </div>
</div>

<div class="wrapper">
    <div class="header">
        <h1>易鼎战略</h1>
        <div class="stamp">YIDING STRATEGY · 东方战略智库</div>
    </div>
    <div class="control-panel">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <input type="text" id="user-question" class="input-box" placeholder="写下当下的困局、迷茫或抉择..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="castAndAnalyze()">凝神起卦</button>
    </div>
    <div id="status-box" class="status-msg"></div>
    <div id="result-panel" class="result-panel">
        <div class="gua-display">
            <div class="gua-symbol" id="hex-symbol">䷀</div>
            <div class="gua-name" id="hex-title">【乾为天】</div>
            <div class="gua-details" id="hex-line">爻位：初九</div>
        </div>
        <div class="card">
            <div class="card-title">大局 · 卦意</div>
            <div class="classic-quote" id="gua-ci"></div>
            <div class="classic-explain" id="gua-ci-desc"></div>
        </div>
        <div class="card">
            <div class="card-title">微观 · 爻变</div>
            <div class="classic-quote" id="yao-ci"></div>
            <div class="classic-explain" id="yao-ci-desc"></div>
        </div>
        <div class="card strategy-card">
            <div class="card-title strategy-title">天人合一 · 现实推演</div>
            <div class="strategy-content" id="strategy-content"></div>
        </div>
    </div>
</div>

<div class="share-control" id="share-control">
    <div class="share-control-inner">
        <button class="btn" id="share-btn" onclick="generateShareImage()">生成宇宙宿命感分享图 (竖版)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    function initCanvas() {
        width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; particles = [];
        const count = window.innerWidth < 768 ? 40 : 80;
        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2,
                size: Math.random() * 1.5 + 0.5, alpha: Math.random() * 0.6 + 0.1
            });
        }
    }
    function animate() {
        ctx.clearRect(0, 0, width, height); ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx = -p.vx; if (p.y < 0 || p.y > height) p.vy = -p.vy;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`; ctx.fill();
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j]; let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 120) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 - dist/1000})`; ctx.stroke(); }
            }
        }
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', initCanvas); initCanvas(); animate();

    const hexagrams = [
        "乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比",
        "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫",
        "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复",
        "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒",
        "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解",
        "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井",
        "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅",
        "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"
    ];
    const hexagramBinaries = ["111111", "000000", "100010", "010001", "111010", "010111", "010000", "000010", "111011", "110111", "111000", "000111", "101111", "111101", "001000", "000100", "100110", "011001", "110000", "000011", "100101", "101001", "000001", "100000", "100111", "111001", "100001", "011110", "010010", "101101", "001110", "011100", "001111", "111100", "000101", "101000", "101011", "110101", "001010", "010100", "110001", "100011", "111110", "011111", "000110", "011000", "010110", "011010", "101110", "011101", "100100", "001001", "001011", "110100", "101100", "001101", "011011", "110110", "010011", "110010", "110011", "001100", "101010", "010101"];
    function getLineName(binaryStr, lineNumber) {
        const isYang = binaryStr[lineNumber - 1] === '1';
        const yangNames = ["初九", "九二", "九三", "九四", "九五", "上九"];
        const yinNames = ["初六", "六二", "六三", "六四", "六五", "上六"];
        return isYang ? yangNames[lineNumber - 1] : yinNames[lineNumber - 1];
    }
    function showStatus(msg, isError = false) {
        const box = document.getElementById('status-box'); box.style.display = 'block'; box.className = isError ? 'status-msg status-error' : 'status-msg status-loading'; box.innerHTML = msg;
    }
    function parseAIResponse(text) {
        const sections = { gua_ci: "【卦辞原文】", gua_ci_desc: "【卦辞解析】", yao_ci: "【爻辞原文】", yao_ci_desc: "【爻辞解析】", strategy: "【战略推演】" };
        let parsed = {}; let keys = Object.keys(sections);
        for(let i=0; i<keys.length; i++) {
            let key = keys[i]; let startTag = sections[key]; let nextTag = i < keys.length - 1 ? sections[keys[i+1]] : null;
            let startIndex = text.indexOf(startTag);
            if (startIndex === -1) { parsed[key] = "（算力连接偏差，请重新起卦）"; continue; }
            startIndex += startTag.length;
            let endIndex = nextTag ? text.indexOf(nextTag, startIndex) : text.length;
            if (endIndex === -1) endIndex = text.length;
            let content = text.substring(startIndex, endIndex).trim(); content = content.replace(/\n/g, '<br>'); parsed[key] = content;
        }
        return parsed;
    }

    let currentGuaData = null;

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        const btn = document.getElementById('submit-btn');
        const shareControl = document.getElementById('share-control');
        
        if (!question.trim()) { showStatus("心不可不诚，请写下您的所思所困。", true); return; }

        document.getElementById('result-panel').style.display = 'none'; shareControl.style.display = 'none'; btn.innerText = "太极流转中..."; btn.disabled = true;
        showStatus("太极生两仪... 正在调取高维算力推演天机");

        const index = Math.floor(Math.random() * 64); const name = hexagrams[index]; const line = Math.floor(Math.random() * 6) + 1; const symbol = String.fromCodePoint(0x4DC0 + index); const exactLineName = getLineName(hexagramBinaries[index], line);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { 
                            role: "system", 
                            content: `你是一位深谙《周易》的国学大师与战略智库。警告：根据二进制结构推算，该爻的确切爻名为【${exactLineName}】。你必须严格检索此爻名在《易经》原本中对应的爻辞，严禁张冠李戴。品牌名为“易鼎战略”。

请严格按照标题格式输出：
【卦辞原文】
【卦辞解析】 (字数限80字)
【爻辞原文】
【爻辞解析】
【战略推演】 (将易理与现实融合，<p>分段。)`
                        },
                        { role: "user", content: `卦象：【${name}】，变爻：第 ${line} 爻（确切爻名：${exactLineName}）。问题：${question}` }
                    ]
                })
            });

            const data = await response.json(); if (!response.ok) { throw new Error(data.error?.message || "天道网络阻碍"); }
            const rawText = data.choices[0].message.content; const result = parseAIResponse(rawText);

            currentGuaData = { 
                symbol, name, exactLineName, 
                guaCi: result.gua_ci, guaCiDesc: result.gua_ci_desc,
                yaoCi: result.yao_ci, yaoCiDesc: result.yao_ci_desc,
                strategy: result.strategy 
            };

            document.getElementById('hex-symbol').innerText = symbol; document.getElementById('hex-title').innerText = `【${name}】`; document.getElementById('hex-line').innerText = `爻位：${exactLineName}`;
            document.getElementById('gua-ci').innerText = `「 ${result.gua_ci} 」`; document.getElementById('gua-ci-desc').innerHTML = result.gua_ci_desc;
            document.getElementById('yao-ci').innerText = `「 ${result.yao_ci} 」`; document.getElementById('yao-ci-desc').innerHTML = result.yao_ci_desc;
            document.getElementById('strategy-content').innerHTML = result.strategy;

            document.getElementById('status-box').style.display = 'none'; document.getElementById('result-panel').style.display = 'block';
            shareControl.style.display = 'flex'; document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (e) {
            console.error(e); showStatus(`推演中断。<br>原因：${e.message}`, true); currentGuaData = null;
        } finally {
            btn.innerText = "凝神起卦"; btn.disabled = false;
        }
    }

    async function generateShareImage() {
        if (!currentGuaData) { alert("推演未完成。"); return; }
        const shareBtn = document.getElementById('share-btn'); const modal = document.getElementById('image-modal'); const finalImage = document.getElementById('final-share-image'); const template = document.getElementById('share-card-template');
        
        shareBtn.innerText = "星图绘制中..."; shareBtn.disabled = true;

        document.getElementById('tmpl-gua-symbol').innerText = currentGuaData.symbol;
        document.getElementById('tmpl-gua-name').innerText = currentGuaData.name;
        document.getElementById('tmpl-yao-name').innerText = `爻位：${currentGuaData.exactLineName}`;

        document.getElementById('tmpl-gua-ci').innerText = `「 ${currentGuaData.guaCi} 」`;
        document.getElementById('tmpl-gua-ci-desc').innerText = currentGuaData.guaCiDesc;
        document.getElementById('tmpl-yao-ci').innerText = `「 ${currentGuaData.yaoCi} 」`;
        document.getElementById('tmpl-yao-ci-desc').innerText = currentGuaData.yaoCiDesc;
        document.getElementById('tmpl-strategy-block').innerHTML = currentGuaData.strategy;

        const qrcodeCanvas = document.getElementById('tmpl-qrcode-canvas');
        try {
            await QRCode.toCanvas(qrcodeCanvas, 'https://www.yishu-strategy.com/', {
                width: 130, margin: 0, color: { dark: '#000000', light: '#ffffff' } 
            });
        } catch (err) { console.error("QR Error", err); }

        template.style.display = 'flex'; 

        try {
            await new Promise(r => setTimeout(r, 200));
            const canvas = await html2canvas(template, {
                scale: 2, useCORS: true, backgroundColor: '#05070a', logging: false
            });
            finalImage.src = canvas.toDataURL('image/png');
            modal.style.display = 'flex';
        } catch (e) {
            console.error(e); alert("星图绘制中断，云端矩阵故障");
        } finally {
            template.style.display = 'none'; 
            shareBtn.innerText = "生成宇宙宿命感分享图 (竖版)"; shareBtn.disabled = false;
        }
    }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
</script>
