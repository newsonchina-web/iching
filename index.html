<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易鼎战略 | 东方决策智库</title>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #05070a; --text-main: #d1c5b4; --text-dim: #8c857a;
            --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4);
            --glass-bg: rgba(15, 20, 25, 0.8);
            --glass-border: rgba(212, 175, 55, 0.3);
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-dark); font-family: "Noto Serif SC", STSong, "Source Han Serif SC", serif;
            color: var(--text-main); overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .wrapper {
            position: relative; z-index: 10; max-width: 640px; width: 100%;
            padding: 40px 20px 120px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 40px; margin-top: 2vh; }
        .header h1 {
            font-size: 36px; font-weight: normal; letter-spacing: 12px; margin: 0 0 10px 12px;
            color: var(--gold);
        }
        .header .stamp { font-size: 12px; letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; font-family: sans-serif; }

        .control-panel {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 30px; box-sizing: border-box;
            margin-bottom: 40px;
        }
        
        .input-box {
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background: transparent; font-size: 16px; font-family: inherit;
            text-align: center; color: #fff; outline: none; transition: 0.3s;
            margin-bottom: 30px; letter-spacing: 1px;
        }
        .input-box:focus { border-bottom-color: var(--gold); }
        .input-box::placeholder { color: #5a544d; }

        .btn {
            display: block; width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 15px; font-size: 16px; font-family: inherit; letter-spacing: 8px; text-indent: 8px; border-radius: 4px;
            cursor: pointer; transition: 0.3s; text-align: center;
        }
        .btn:disabled { color: var(--text-dim); border-color: var(--text-dim); cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: rgba(212, 175, 55, 0.1); }

        .status-msg { text-align: center; font-size: 14px; letter-spacing: 2px; margin-top: -20px; margin-bottom: 30px; display: none; color: var(--gold); }

        .result-panel { width: 100%; display: none; }

        .gua-display { text-align: center; margin-bottom: 40px; }
        .gua-symbol { font-size: 80px; line-height: 1; color: var(--gold); margin-bottom: 10px; }
        .gua-name { font-size: 24px; color: var(--text-main); letter-spacing: 4px; margin-bottom: 8px; }
        .gua-details { font-size: 14px; color: var(--gold); letter-spacing: 2px; }

        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 4px; padding: 25px; margin-bottom: 20px; }
        .card-title { font-size: 16px; color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 10px; font-weight: bold;}
        .classic-quote { font-size: 18px; color: #fff; margin-bottom: 10px; }
        .classic-explain { font-size: 15px; color: var(--text-dim); line-height: 1.8; text-align: justify; }
        .strategy-content { font-size: 16px; color: var(--text-main); line-height: 2; text-align: justify; }

        .share-control { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 7, 10, 0.95); border-top: 1px solid var(--glass-border); padding: 20px; box-sizing: border-box; z-index: 100; display: none; justify-content: center; }

        /* 海报模板 */
        #share-card-template {
            position: absolute; left: -9999px; top: -9999px; 
            width: 750px; background: #05070a; color: #d1c5b4; 
            display: none; flex-direction: column; align-items: center;
        }
        
        .poster-img { width: 100%; height: auto; display: block; }
        
        .poster-content { padding: 40px 50px 60px 50px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        .poster-gua { text-align: center; margin-bottom: 30px; }
        .poster-gua-symbol { font-size: 60px; color: #d4af37; line-height: 1; margin-bottom: 10px; }
        .poster-gua-title { font-size: 28px; color: #fff; margin-bottom: 5px; letter-spacing: 4px;}
        .poster-gua-yao { font-size: 18px; color: #d4af37; }

        .poster-text-box { width: 100%; border: 1px solid rgba(212,175,55,0.3); padding: 30px; margin-bottom: 25px; background: rgba(20,25,35,0.5); box-sizing: border-box;}
        .poster-box-title { color: #d4af37; font-size: 18px; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 10px;}
        .poster-quote { font-size: 20px; color: #fff; margin-bottom: 10px; line-height: 1.5; }
        .poster-desc { font-size: 16px; color: #a59c90; line-height: 1.8; text-align: justify; }
        .poster-strategy { font-size: 18px; color: #e6dfd3; line-height: 2; text-align: justify; }

        .poster-footer { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 20px; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 30px;}
        .qr-wrapper { padding: 10px; background: #fff; border: 2px solid #d4af37; border-radius: 4px; margin-bottom: 15px;}
        .qr-canvas { display: block; width: 120px !important; height: 120px !important; }
        .poster-footer-text { font-size: 14px; color: #a59c90; letter-spacing: 2px; margin-bottom: 5px; }
        .poster-footer-url { font-size: 14px; color: #d4af37; font-family: sans-serif; }

        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-content { max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center; position: relative; }
        #final-share-image { max-width: 100%; max-height: 80vh; border: 1px solid var(--gold); border-radius: 4px; object-fit: contain; }
        .modal-tip { color: var(--gold); margin-top: 15px; font-size: 14px; letter-spacing: 2px; }
        .close-modal-btn { position: absolute; top: -40px; right: 0; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 6px 16px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<!-- 海报生成区 -->
<div id="share-card-template">
    <!-- 直接嵌入用户指定的图片 -->
    <img src="hero-bg.jpg" class="poster-img" crossorigin="anonymous" alt="易鼎战略">
    
    <div class="poster-content">
        <div class="poster-gua">
            <div class="poster-gua-symbol" id="tmpl-gua-symbol">䷀</div>
            <div class="poster-gua-title" id="tmpl-gua-name">乾为天</div>
            <div class="poster-gua-yao" id="tmpl-yao-name">初九</div>
        </div>

        <div class="poster-text-box">
            <div class="poster-box-title">大局 · 卦意</div>
            <div class="poster-quote" id="tmpl-gua-ci"></div>
            <div class="poster-desc" id="tmpl-gua-ci-desc"></div>
        </div>
        
        <div class="poster-text-box">
            <div class="poster-box-title">微观 · 爻变</div>
            <div class="poster-quote" id="tmpl-yao-ci"></div>
            <div class="poster-desc" id="tmpl-yao-ci-desc"></div>
        </div>
        
        <div class="poster-text-box" style="border-color: #d4af37;">
            <div class="poster-box-title" style="color: #fff; background: rgba(212,175,55,0.2); padding: 5px 10px; display: inline-block; border: none;">现实推演</div>
            <div class="poster-strategy" id="tmpl-strategy-block"></div>
        </div>

        <div class="poster-footer">
            <div class="qr-wrapper">
                <canvas id="tmpl-qrcode-canvas" class="qr-canvas"></canvas>
            </div>
            <div class="poster-footer-text">长按扫码获取战略推演</div>
            <div class="poster-footer-url">www.yishu-strategy.com</div>
        </div>
    </div>
</div>

<div id="image-modal">
    <div class="modal-content">
        <button class="close-modal-btn" onclick="closeModal()">关闭</button>
        <img src="" alt="分享海报" id="final-share-image">
        <div class="modal-tip">长按保存海报</div>
    </div>
</div>

<div class="wrapper">
    <div class="header">
        <h1>易鼎战略</h1>
        <div class="stamp">YIDING STRATEGY</div>
    </div>
    <div class="control-panel">
        <input type="text" id="user-question" class="input-box" placeholder="输入您当下的问题或困局..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="castAndAnalyze()">开始起卦</button>
    </div>
    <div id="status-box" class="status-msg"></div>
    <div id="result-panel" class="result-panel">
        <div class="gua-display">
            <div class="gua-symbol" id="hex-symbol">䷀</div>
            <div class="gua-name" id="hex-title">乾为天</div>
            <div class="gua-details" id="hex-line">初九</div>
        </div>
        <div class="card">
            <div class="card-title">卦意</div>
            <div class="classic-quote" id="gua-ci"></div>
            <div class="classic-explain" id="gua-ci-desc"></div>
        </div>
        <div class="card">
            <div class="card-title">爻变</div>
            <div class="classic-quote" id="yao-ci"></div>
            <div class="classic-explain" id="yao-ci-desc"></div>
        </div>
        <div class="card">
            <div class="card-title">战略推演</div>
            <div class="strategy-content" id="strategy-content"></div>
        </div>
    </div>
</div>

<div class="share-control" id="share-control">
    <button class="btn" id="share-btn" onclick="generateShareImage()">生成分享海报</button>
</div>

<script>
    // 星空背景动画
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    function initCanvas() {
        width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2, size: Math.random() * 1.5, alpha: Math.random() * 0.5 + 0.1 });
        }
    }
    function animate() {
        ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, width, height);
        for (let p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx = -p.vx; if (p.y < 0 || p.y > height) p.vy = -p.vy;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`; ctx.fill();
        }
        requestAnimationFrame(animate);
    }
    window.addEventListener('resize', initCanvas); initCanvas(); animate();

    const hexagrams = ["乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比", "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫", "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复", "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒", "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解", "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井", "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅", "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"];
    const hexagramBinaries = ["111111", "000000", "100010", "010001", "111010", "010111", "010000", "000010", "111011", "110111", "111000", "000111", "101111", "111101", "001000", "000100", "100110", "011001", "110000", "000011", "100101", "101001", "000001", "100000", "100111", "111001", "100001", "011110", "010010", "101101", "001110", "011100", "001111", "111100", "000101", "101000", "101011", "110101", "001010", "010100", "110001", "100011", "111110", "011111", "000110", "011000", "010110", "011010", "101110", "011101", "100100", "001001", "001011", "110100", "101100", "001101", "011011", "110110", "010011", "110010", "110011", "001100", "101010", "010101"];
    
    function getLineName(binaryStr, lineNumber) {
        const isYang = binaryStr[lineNumber - 1] === '1';
        const yangNames = ["初九", "九二", "九三", "九四", "九五", "上九"];
        const yinNames = ["初六", "六二", "六三", "六四", "六五", "上六"];
        return isYang ? yangNames[lineNumber - 1] : yinNames[lineNumber - 1];
    }

    function parseAIResponse(text) {
        const sections = { gua_ci: "【卦辞】", gua_ci_desc: "【卦辞解析】", yao_ci: "【爻辞】", yao_ci_desc: "【爻辞解析】", strategy: "【推演】" };
        let parsed = {}; let keys = Object.keys(sections);
        for(let i=0; i<keys.length; i++) {
            let key = keys[i]; let startTag = sections[key]; let nextTag = i < keys.length - 1 ? sections[keys[i+1]] : null;
            let startIndex = text.indexOf(startTag);
            if (startIndex === -1) { parsed[key] = ""; continue; }
            startIndex += startTag.length;
            let endIndex = nextTag ? text.indexOf(nextTag, startIndex) : text.length;
            if (endIndex === -1) endIndex = text.length;
            let content = text.substring(startIndex, endIndex).trim(); content = content.replace(/\n/g, '<br>'); parsed[key] = content;
        }
        return parsed;
    }

    let currentGuaData = null;

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        const btn = document.getElementById('submit-btn');
        if (!question.trim()) { alert("请输入问题。"); return; }

        document.getElementById('result-panel').style.display = 'none'; 
        document.getElementById('share-control').style.display = 'none'; 
        btn.innerText = "正在推演..."; btn.disabled = true;

        const index = Math.floor(Math.random() * 64); const name = hexagrams[index]; const line = Math.floor(Math.random() * 6) + 1; 
        const symbol = String.fromCodePoint(0x4DC0 + index); const exactLineName = getLineName(hexagramBinaries[index], line);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { 
                            role: "system", 
                            content: `结合用户问题，对《易经》进行解读。语气平实客观。
当前抽中：${name}卦，${exactLineName}。
请按以下格式输出（保留括号）：
【卦辞】(原文)
【卦辞解析】(简要解析)
【爻辞】(原文)
【爻辞解析】(简要解析)
【推演】(结合用户问题给出建议，分段说明)`
                        },
                        { role: "user", content: `问题：${question}` }
                    ]
                })
            });

            const data = await response.json(); 
            if (!response.ok) throw new Error("网络错误");
            const result = parseAIResponse(data.choices[0].message.content);

            currentGuaData = { symbol, name, exactLineName, ...result };

            document.getElementById('hex-symbol').innerText = symbol; 
            document.getElementById('hex-title').innerText = name; 
            document.getElementById('hex-line').innerText = exactLineName;
            
            document.getElementById('gua-ci').innerText = result.gua_ci; 
            document.getElementById('gua-ci-desc').innerHTML = result.gua_ci_desc;
            document.getElementById('yao-ci').innerText = result.yao_ci; 
            document.getElementById('yao-ci-desc').innerHTML = result.yao_ci_desc;
            document.getElementById('strategy-content').innerHTML = result.strategy;

            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('share-control').style.display = 'flex';
            document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth' });

        } catch (e) {
            alert("推演失败，请重试。");
        } finally {
            btn.innerText = "重新起卦"; btn.disabled = false;
        }
    }

    async function generateShareImage() {
        if (!currentGuaData) return;
        const btn = document.getElementById('share-btn'); 
        btn.innerText = "生成中..."; btn.disabled = true;

        document.getElementById('tmpl-gua-symbol').innerText = currentGuaData.symbol;
        document.getElementById('tmpl-gua-name').innerText = currentGuaData.name;
        document.getElementById('tmpl-yao-name').innerText = currentGuaData.exactLineName;
        document.getElementById('tmpl-gua-ci').innerText = currentGuaData.gua_ci;
        document.getElementById('tmpl-gua-ci-desc').innerHTML = currentGuaData.gua_ci_desc;
        document.getElementById('tmpl-yao-ci').innerText = currentGuaData.yao_ci;
        document.getElementById('tmpl-yao-ci-desc').innerHTML = currentGuaData.yao_ci_desc;
        document.getElementById('tmpl-strategy-block').innerHTML = currentGuaData.strategy;

        try {
            await QRCode.toCanvas(document.getElementById('tmpl-qrcode-canvas'), 'https://www.yishu-strategy.com/', {
                width: 120, margin: 1, color: { dark: '#000', light: '#fff' } 
            });
        } catch (err) {}

        const template = document.getElementById('share-card-template');
        template.style.display = 'flex'; 

        try {
            await new Promise(r => setTimeout(r, 100)); // 等待渲染
            const canvas = await html2canvas(template, { scale: 2, useCORS: true, backgroundColor: '#05070a' });
            document.getElementById('final-share-image').src = canvas.toDataURL('image/png');
            document.getElementById('image-modal').style.display = 'flex';
        } catch (e) {
            alert("生成图片失败，请检查 hero-bg.jpg 是否在同目录下。");
        } finally {
            template.style.display = 'none'; 
            btn.innerText = "生成分享海报"; btn.disabled = false;
        }
    }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
</script>
</body>
</html>
