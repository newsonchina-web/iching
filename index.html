<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易经战略智库</title>
    <style>
        :root {
            --bg: #f5f1e7;
            --text-main: #3e3832;
            --text-light: #8a7f74;
            --accent: #8e291c; /* 故宫红 */
            --border: #d4cbb8;
        }
        body {
            font-family: "Noto Serif SC", STSong, "Source Han Serif SC", "Times New Roman", serif;
            background-color: var(--bg);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 20px 50px rgba(62, 56, 50, 0.08);
            border-radius: 8px;
            padding: 50px 40px;
            box-sizing: border-box;
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            pointer-events: none;
        }
        h1 {
            text-align: center;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 10px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--text-light);
            margin-bottom: 40px;
            font-family: sans-serif;
            text-transform: uppercase;
        }
        .input-box {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            font-size: 18px;
            font-family: inherit;
            text-align: center;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
            margin-bottom: 40px;
        }
        .input-box:focus {
            border-bottom-color: var(--accent);
            box-shadow: 0 1px 0 var(--accent);
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-family: inherit;
            letter-spacing: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn:hover {
            background: var(--accent);
            box-shadow: 0 8px 20px rgba(142, 41, 28, 0.2);
            transform: translateY(-2px);
        }
        .result-panel {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .hexagram-header {
            text-align: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .hexagram-name {
            font-size: 38px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .hexagram-line {
            font-size: 16px;
            color: var(--text-light);
        }
        .ai-text {
            line-height: 2;
            font-size: 16px;
            text-align: justify;
            color: var(--text-main);
        }
        .ai-text p {
            margin-bottom: 1em;
        }
        .loading {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>易经战略智库</h1>
    <div class="subtitle">I-Ching Strategic Analysis</div>

    <input type="text" id="user-question" class="input-box" placeholder="请输入当下的决策困局..." autocomplete="off">
    <button class="btn" onclick="castAndAnalyze()">静心起卦</button>

    <div id="loading-indicator" class="loading">正在接入智库算力进行深度推演...</div>

    <div id="result-panel" class="result-panel">
        <div class="hexagram-header">
            <div class="hexagram-name" id="gua-name">--</div>
            <div class="hexagram-line" id="gua-line">--</div>
        </div>
        <div class="ai-text" id="ai-response"></div>
    </div>
</div>

<script>
    const hexagrams = [
        "乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比",
        "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫",
        "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复",
        "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒",
        "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解",
        "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井",
        "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅",
        "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"
    ];

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        if (!question.trim()) {
            alert("心诚则灵，请先输入您的问题。");
            return;
        }

        document.getElementById('result-panel').style.display = 'none';
        document.getElementById('loading-indicator').style.display = 'block';

        const name = hexagrams[Math.floor(Math.random() * 64)];
        const line = Math.floor(Math.random() * 6) + 1;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: "你是一位精通《易经》的现代战略分析师。请结合用户摇出的卦象、爻位和现实困境，给出深邃、客观且富有洞察力的战略建议。语气需冷静、专业，排版清晰，分段论述。" },
                        { role: "user", content: `卦象：【${name}】，变爻：第 ${line} 爻。问题：${question}` }
                    ]
                })
            });

            const data = await response.json();
            
            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('gua-name').innerText = `【${name}】`;
            document.getElementById('gua-line').innerText = `变爻：第 ${line} 爻`;

            const responseBox = document.getElementById('ai-response');

            if (response.ok) {
                let text = data.choices[0].message.content;
                // 处理换行符，使其更符合中文排版
                text = text.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p}</p>`).join('');
                responseBox.innerHTML = text;
            } else {
                responseBox.innerHTML = `<p style="color:var(--accent); text-align:center;">推演中断：<br>${data.error?.message || "接口访问异常"}</p>`;
            }
        } catch (e) {
            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('ai-response').innerHTML = `<p style="color:var(--accent); text-align:center;">连接中断。请检查云端部署状态。</p>`;
        }
    }
</script>
</body>
</html>
