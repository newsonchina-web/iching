<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易鼎战略 | 东方决策智库</title>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #05070a; --text-main: #d1c5b4; --text-dim: #8c857a;
            --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4);
            --red: #8e291c;
            --glass-bg: rgba(15, 20, 25, 0.85); --glass-border: rgba(212, 175, 55, 0.3);
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: var(--bg-dark); font-family: "Noto Serif SC", STSong, "Source Han Serif SC", serif;
            color: var(--text-main); overflow-x: hidden;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .wrapper {
            position: relative; z-index: 10; max-width: 640px; width: 100%; margin: 0 auto;
            padding: 50px 20px 150px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: 42px; font-weight: 300; letter-spacing: 16px; margin: 0 0 15px 16px; color: var(--gold); text-shadow: 0 0 30px var(--gold-glow); }
        .header .stamp { font-size: 13px; letter-spacing: 8px; color: var(--text-dim); text-transform: uppercase; }

        .control-panel {
            width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 4px; padding: 40px 30px; box-sizing: border-box;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); margin-bottom: 40px;
        }
        
        .input-box {
            width: 100%; padding: 18px 0; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            background: transparent; font-size: 18px; font-family: inherit; text-align: center; color: #fff; outline: none; margin-bottom: 40px; transition: 0.4s;
        }
        .input-box:focus { border-bottom-color: var(--gold); background: rgba(212, 175, 55, 0.05); }

        .btn {
            display: block; width: 100%; background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 18px; font-size: 18px; letter-spacing: 10px; text-indent: 10px; border-radius: 2px; cursor: pointer; transition: 0.5s;
        }
        .btn:hover { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 30px var(--gold-glow); }

        .result-panel { width: 100%; display: none; animation: fadeIn 1s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .gua-display { text-align: center; margin-bottom: 40px; }
        .gua-symbol { font-size: 120px; line-height: 1; color: var(--gold); margin-bottom: 10px; text-shadow: 0 0 40px var(--gold-glow); }
        .gua-name { font-size: 32px; color: #fff; letter-spacing: 10px; margin-bottom: 10px; font-weight: bold; }
        .gua-details { font-size: 16px; color: var(--gold); letter-spacing: 4px; }

        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 35px; margin-bottom: 25px; position: relative; }
        .card-title { font-size: 15px; color: var(--gold); margin-bottom: 20px; letter-spacing: 4px; text-transform: uppercase; border-left: 3px solid var(--gold); padding-left: 15px; font-weight: bold;}
        .card-content { font-size: 17px; color: var(--text-main); line-height: 2.2; text-align: justify; }
        .card-content strong { color: var(--gold); font-weight: normal; }

        .status-box { text-align: center; color: var(--gold); font-size: 14px; letter-spacing: 2px; margin-top: -30px; margin-bottom: 40px; display: none; }

        .share-control { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 7, 10, 0.95); border-top: 1px solid var(--glass-border); padding: 25px; box-sizing: border-box; z-index: 100; display: none; justify-content: center; backdrop-filter: blur(10px); }

        /* 海报模板 - 高度自适应 */
        #share-card-template {
            position: absolute; left: -9999px; top: -9999px; 
            width: 850px; background: #05070a; color: #d1c5b4; 
            display: none; flex-direction: column; align-items: center; height: auto; padding-bottom: 40px;
        }
        
        .poster-hero { width: 100%; height: auto; display: block; }
        .poster-hero-wrap { position: relative; width: 100%; }
        .poster-floating-gua {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 200px; color: rgba(212, 175, 55, 0.15);
            text-shadow: 0 0 50px rgba(212, 175, 55, 0.4); pointer-events: none;
        }

        .poster-body { padding: 40px 70px; width: 100%; box-sizing: border-box; }
        .poster-header { text-align: center; margin-bottom: 40px; }
        .poster-title { font-size: 64px; letter-spacing: 32px; color: #fff; font-weight: bold; text-shadow: 0 0 40px rgba(212,175,55,0.5); margin-left: 32px;}
        
        .poster-gua-row { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 40px; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 30px;}
        .p-gua-symbol { font-size: 100px; color: var(--gold); line-height: 1; }
        .p-gua-info { text-align: left; }
        .p-gua-name { font-size: 40px; color: #fff; font-weight: bold; letter-spacing: 12px; margin-bottom: 10px;}
        .p-gua-yao { font-size: 20px; color: var(--gold); letter-spacing: 6px; }

        .poster-box { width: 100%; border: 1px solid rgba(212,175,55,0.25); padding: 35px; margin-bottom: 30px; background: rgba(20,25,35,0.4); }
        .poster-box-label { font-size: 20px; color: var(--gold); margin-bottom: 20px; font-weight: bold; border-left: 4px solid var(--gold); padding-left: 15px;}
        .poster-text-main { font-size: 20px; color: #e6dfd3; line-height: 1.9; text-align: justify; }
        .poster-text-main strong { color: var(--gold); font-weight: normal; }

        .poster-footer { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; padding-top: 40px; border-top: 2px solid var(--gold); }
        .f-left { display: flex; flex-direction: column; }
        .f-slogan-big { font-size: 28px; color: #fff; letter-spacing: 6px; font-weight: bold; margin-bottom: 10px; }
        .f-slogan-sub { font-size: 18px; color: var(--text-dim); margin-bottom: 15px; }
        .f-url { font-size: 18px; color: var(--gold); font-family: monospace; }
        
        .qr-container { padding: 15px; background: #fff; border-radius: 4px; box-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .qr-canvas { width: 140px !important; height: 140px !important; display: block; }

        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-wrap { max-width: 90%; max-height: 95%; display: flex; flex-direction: column; align-items: center; position: relative; }
        #final-share-image { max-width: 100%; max-height: 85vh; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(0,0,0,1); overflow-y: auto;}
        .modal-close { position: absolute; top: -50px; right: 0; color: #fff; background: none; border: 1px solid #fff; padding: 8px 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div id="share-card-template">
    <div class="poster-hero-wrap">
        <img id="poster-hero-img" src="" class="poster-hero" crossorigin="anonymous">
        <div class="poster-floating-gua" id="poster-floating-gua">䷀</div>
    </div>
    
    <div class="poster-body">
        <div class="poster-header">
            <div class="poster-title">易鼎戰略</div>
        </div>

        <div class="poster-gua-row">
            <div class="p-gua-symbol" id="p-gua-symbol">䷀</div>
            <div class="p-gua-info">
                <div class="p-gua-name" id="p-gua-name">乾为天</div>
                <div class="p-gua-yao" id="p-gua-yao">爻位：初九</div>
            </div>
        </div>

        <div class="poster-box">
            <div class="poster-box-label">原典象意</div>
            <div class="poster-text-main" id="tmpl-yuan-dian"></div>
        </div>
        <div class="poster-box">
            <div class="poster-box-label">多维解读</div>
            <div class="poster-text-main" id="tmpl-duo-wei"></div>
        </div>
        <div class="poster-box">
            <div class="poster-box-label">行动建议</div>
            <div class="poster-text-main" id="tmpl-xing-dong"></div>
        </div>
        <div class="poster-box" style="border-width: 2px; border-color: var(--gold); background: rgba(212,175,55,0.06);">
            <div class="poster-box-label" style="background: var(--gold); color: #000; padding: 5px 20px; border:none; display:inline-block; margin-left:-35px;">深层哲思</div>
            <div class="poster-text-main" id="tmpl-zhe-si"></div>
        </div>

        <div class="poster-footer">
            <div class="f-left">
                <div class="f-slogan-big">一窥天演，智定鼎局。</div>
                <div class="f-slogan-sub">链接高维智慧 · 掌控绝对变局</div>
                <div class="f-url">www.yishu-strategy.com</div>
            </div>
            <div class="qr-container">
                <canvas id="tmpl-qrcode-canvas" class="qr-canvas"></canvas>
            </div>
        </div>
    </div>
</div>

<div id="image-modal">
    <div class="modal-wrap">
        <button class="modal-close" onclick="closeModal()">关闭预览</button>
        <img src="" id="final-share-image">
        <p style="color:var(--gold); margin-top:20px; letter-spacing:2px; font-weight:bold;">长按海报保存 · 开启你的绝对胜局</p>
    </div>
</div>

<div class="wrapper">
    <div class="header">
        <h1>易鼎战略</h1>
        <div class="stamp">YIDING STRATEGY · 东方战略智库</div>
    </div>
    
    <div class="control-panel">
        <input type="text" id="user-question" class="input-box" placeholder="写下您当下面临的困局或抉择..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="castAndAnalyze()">凝神起卦</button>
    </div>
    
    <div id="status-box" class="status-box"></div>

    <div id="result-panel" class="result-panel">
        <div class="gua-display">
            <div class="gua-symbol" id="hex-symbol">䷀</div>
            <div class="gua-name" id="hex-title"></div>
            <div class="gua-details" id="hex-line"></div>
        </div>
        
        <div class="card">
            <div class="card-title">一、 原典象意</div>
            <div class="card-content" id="res-yuan-dian"></div>
        </div>
        <div class="card">
            <div class="card-title">二、 多维解读</div>
            <div class="card-content" id="res-duo-wei"></div>
        </div>
        <div class="card">
            <div class="card-title">三、 行动建议</div>
            <div class="card-content" id="res-xing-dong"></div>
        </div>
        <div class="card" style="border-width: 2px; border-color: var(--gold);">
            <div class="card-title" style="background: var(--gold); color: #000; padding: 5px 15px; border:none; display:inline-block;">四、 深层哲思</div>
            <div class="card-content" id="res-zhe-si"></div>
        </div>
    </div>
</div>

<div class="share-control" id="share-control">
    <button class="btn" onclick="generateShareImage()">熔铸多维透析海报</button>
</div>

<script>
    // 粒子效果
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, dots;
    function initCanvas() {
        width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; dots = [];
        for (let i = 0; i < 60; i++) {
            dots.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, r: Math.random() * 2 });
        }
    }
    function draw() {
        ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < dots.length; i++) {
            let d = dots[i]; d.x += d.vx; d.y += d.vy;
            if (d.x < 0 || d.x > width) d.vx *= -1; if (d.y < 0 || d.y > height) d.vy *= -1;
            ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(212, 175, 55, 0.6)'; ctx.fill();
            for (let j = i + 1; j < dots.length; j++) {
                let d2 = dots[j]; let dist = Math.hypot(d.x - d2.x, d.y - d2.y);
                if (dist < 150) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.strokeStyle = `rgba(212, 175, 55, ${0.15 - dist/1000})`; ctx.stroke(); }
            }
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', initCanvas); initCanvas(); draw();

    const hexagrams = ["乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比", "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫", "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复", "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒", "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解", "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井", "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅", "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"];
    const hexagramBinaries = ["111111", "000000", "100010", "010001", "111010", "010111", "010000", "000010", "111011", "110111", "111000", "000111", "101111", "111101", "001000", "000100", "100110", "011001", "110000", "000011", "100101", "101001", "000001", "100000", "100111", "111001", "100001", "011110", "010010", "101101", "001110", "011100", "001111", "111100", "000101", "101000", "101011", "110101", "001010", "010100", "110001", "100011", "111110", "011111", "000110", "011000", "010110", "011010", "101110", "011101", "100100", "001001", "001011", "110100", "101100", "001101", "011011", "110110", "010011", "110010", "110011", "001100", "101010", "010101"];
    
    function getLineName(binaryStr, lineNumber) {
        const isYang = binaryStr[lineNumber - 1] === '1';
        const yangNames = ["初九", "九二", "九三", "九四", "九五", "上九"];
        const yinNames = ["初六", "六二", "六三", "六四", "六五", "上六"];
        return isYang ? yangNames[lineNumber - 1] : yinNames[lineNumber - 1];
    }

    function parseAIResponse(text) {
        // 更新解析标签，精确抓取四大部分
        const sections = { yuan_dian: "【原典启示】", duo_wei: "【多维解读】", xing_dong: "【行动建议】", zhe_si: "【深层哲思】" };
        let parsed = {}; let keys = Object.keys(sections);
        for(let i=0; i<keys.length; i++) {
            let key = keys[i]; let startTag = sections[key]; let nextTag = i < keys.length - 1 ? sections[keys[i+1]] : null;
            let startIndex = text.indexOf(startTag);
            if (startIndex === -1) { parsed[key] = ""; continue; }
            startIndex += startTag.length;
            let endIndex = nextTag ? text.indexOf(nextTag, startIndex) : text.length;
            if (endIndex === -1) endIndex = text.length;
            
            let content = text.substring(startIndex, endIndex).trim();
            // 将 Markdown 的 **加粗** 转换为 HTML 的 <strong>，将换行转换为 <br>
            content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            content = content.replace(/\n/g, '<br>');
            parsed[key] = content;
        }
        return parsed;
    }

    let currentGuaData = null;

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        if (!question.trim()) { alert("请写下您的困局。"); return; }
        const btn = document.getElementById('submit-btn');
        btn.innerText = "多维透析中..."; btn.disabled = true;
        document.getElementById('status-box').style.display = 'block';
        document.getElementById('status-box').innerText = "正在链接易理，生成全维度战略分析与哲学内观...";

        const index = Math.floor(Math.random() * 64); const name = hexagrams[index]; const line = Math.floor(Math.random() * 6) + 1; 
        const symbol = String.fromCodePoint(0x4DC0 + index); const exactLineName = getLineName(hexagramBinaries[index], line);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { 
                            role: "system", 
                            content: `你是一位深谙《周易》底层逻辑的顶尖东方战略智囊。
解读原则：回归《周易》“时、位、势、变”核心哲理。将古老的卦辞爻辞，化作极其锐利、透彻、结构化的现代决策指南。语气深邃、客观、直击灵魂。

请严格按照以下4个【】大标题输出，不需要前言后语，直接进入正文：

【原典启示】
- 辞意译注：列出本卦卦辞与本爻爻辞原文，并给出精准、达雅的现代汉语翻译。
- 象理剖析：深入剖析本卦与本爻的象征意义（结合上下卦的自然意象，如水火交融、山风互逆等）以及动态意象（如当前爻位在全卦中的发展阶段与运动趋势）。

【多维解读】
结合用户的问题，分层次解析：
- 事功层面：事业、决策、合作的具体启示。
- 心性层面：内心状态、欲望、恐惧的映照。
- 关系层面：与上下级、伴侣、团队的互动模式。
- 时机层面：当前处于何种发展阶段。

【行动建议】
- 吉凶机变：趋避、进退之机。
- 实操建议：给出3条具体、极其可操作的建议（严禁空洞的“要真诚”之类）。
- 变数应对：指出可能的变数与防范预案。

【深层哲思】
- 内观发问：提出2-3个发人深省的反思问题，引导提问者内观。
- 核心教诲：一句话点出本爻最本质的生命课题。
- 结语提示：说明《易经》是“镜子”而非“答案”，鼓励结合自身情境体悟，并欢迎提供更多背景以便深入。

提示：你可以使用小标题，重点词汇请使用**加粗**（Markdown格式）。`
                        },
                        { role: "user", content: `抽中卦象：${name}卦，爻位：${exactLineName}。问题：${question}` }
                    ]
                })
            });

            const data = await response.json();
            const result = parseAIResponse(data.choices[0].message.content);
            currentGuaData = { symbol, name, exactLineName, ...result };

            document.getElementById('hex-symbol').innerText = symbol; 
            document.getElementById('hex-title').innerText = name; 
            document.getElementById('hex-line').innerText = `爻位：${exactLineName}`;
            
            document.getElementById('res-yuan-dian').innerHTML = result.yuan_dian; 
            document.getElementById('res-duo-wei').innerHTML = result.duo_wei; 
            document.getElementById('res-xing-dong').innerHTML = result.xing_dong; 
            document.getElementById('res-zhe-si').innerHTML = result.zhe_si; 

            document.getElementById('status-box').style.display = 'none';
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('share-control').style.display = 'flex';
            document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth' });

        } catch (e) {
            alert("易理推演暂时受阻，请重新起卦。");
        } finally {
            btn.innerText = "凝神起卦"; btn.disabled = false;
        }
    }

    async function generateShareImage() {
        if (!currentGuaData) return;
        const btn = document.querySelector('.share-control .btn');
        btn.innerText = "符文熔铸中..."; btn.disabled = true;

        document.getElementById('poster-hero-img').src = 'hero-bg.jpg?v=' + Date.now();
        document.getElementById('poster-floating-gua').innerText = currentGuaData.symbol;
        document.getElementById('p-gua-symbol').innerText = currentGuaData.symbol;
        document.getElementById('p-gua-name').innerText = currentGuaData.name;
        document.getElementById('p-gua-yao').innerText = `爻位：${currentGuaData.exactLineName}`;
        
        document.getElementById('tmpl-yuan-dian').innerHTML = currentGuaData.yuan_dian;
        document.getElementById('tmpl-duo-wei').innerHTML = currentGuaData.duo_wei;
        document.getElementById('tmpl-xing-dong').innerHTML = currentGuaData.xing_dong;
        document.getElementById('tmpl-zhe-si').innerHTML = currentGuaData.zhe_si;

        try {
            await QRCode.toCanvas(document.getElementById('tmpl-qrcode-canvas'), 'https://www.yishu-strategy.com/', { width: 140, margin: 1 });
        } catch (err) {}

        const template = document.getElementById('share-card-template');
        template.style.display = 'flex'; 

        try {
            await new Promise(r => setTimeout(r, 600));
            // 增加 windowHeight 参数解决截图截不断或者过长的问题
            const canvas = await html2canvas(template, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: '#05070a',
                windowHeight: template.scrollHeight
            });
            document.getElementById('final-share-image').src = canvas.toDataURL('image/png');
            document.getElementById('image-modal').style.display = 'flex';
        } catch (e) {
            alert("生成失败，请检查 hero-bg.jpg。");
        } finally {
            template.style.display = 'none'; 
            btn.innerText = "熔铸多维透析海报"; btn.disabled = false;
        }
    }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
</script>
</body>
</html>
