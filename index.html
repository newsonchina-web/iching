<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字易经战略智库</title>
    <style>
        :root {
            --bg-color: #fdfaf6;
            --main-color: #2c3e50;
            --accent-color: #8e44ad;
            --text-color: #34495e;
            --border-color: #dcdde1;
        }
        body {
            font-family: 'Optima', 'PingFang SC', 'Source Han Serif SC', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            max-width: 500px;
            width: 90%;
            background: white;
            padding: 40px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
        }
        .app-container::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid #f0f0f0;
            pointer-events: none;
        }
        h1 {
            font-weight: 400;
            letter-spacing: 4px;
            color: var(--main-color);
            margin-bottom: 10px;
            font-size: 24px;
        }
        .tagline {
            font-size: 12px;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
        .input-group {
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-bottom-color: var(--main-color);
        }
        .action-btn {
            background: var(--main-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .action-btn:hover {
            background: #1a252f;
            transform: translateY(-2px);
        }
        .action-btn.secondary {
            background: transparent;
            color: var(--main-color);
            border: 1px solid var(--main-color);
        }
        #result-display {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            display: none;
            border-radius: 4px;
        }
        .gua-name {
            font-size: 28px;
            color: var(--main-color);
            margin-bottom: 5px;
        }
        .gua-line {
            font-size: 14px;
            color: var(--accent-color);
        }
        #ai-response {
            margin-top: 40px;
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            color: #2c3e50;
            display: none;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .loading {
            color: #95a5a6;
            font-style: italic;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <h1>数字易经智库</h1>
    <p class="tagline">Digital I-Ching Strategic Studio</p>

    <div id="setup-section">
        <div class="input-group">
            <input type="text" id="user-question" placeholder="在此输入您当下的决策困局...">
        </div>
        <button class="action-btn" onclick="castAndAnalyze()">感应起卦并解码</button>
    </div>

    <div id="result-display">
        <div class="gua-name" id="gua-name">--</div>
        <div class="gua-line" id="gua-line">--</div>
    </div>

    <div id="ai-response"></div>
</div>

<script>
    const hexagrams = [
        "乾为天", "坤为地", "水雷屯", "山水蒙", "水天需", "天水讼", "地水师", "水地比",
        "风天小畜", "天泽履", "地天泰", "天地否", "天火同人", "火天大有", "地山谦", "雷地豫",
        "泽雷随", "山风蛊", "地泽临", "风地观", "火雷噬嗑", "山火贲", "山地剥", "地雷复",
        "天雷无妄", "山天大畜", "山雷颐", "泽风大过", "坎为水", "离为火", "泽山咸", "雷风恒",
        "天山遁", "雷天大壮", "火地晋", "地火明夷", "风火家人", "火泽睽", "水山蹇", "雷水解",
        "山泽损", "风雷益", "泽天夬", "天风姤", "泽地萃", "地风升", "泽水困", "水风井",
        "泽火革", "火风鼎", "震为雷", "艮为山", "风山渐", "雷泽归妹", "雷火丰", "火山旅",
        "巽为风", "兑为泽", "风水涣", "水泽节", "风泽中孚", "雷山小过", "水火既济", "火水未济"
    ];

    async function castAndAnalyze() {
        const question = document.getElementById('user-question').value;
        if (!question.trim()) {
            alert("请先输入您的问题，方能感应气场。");
            return;
        }

        // 1. 随机起卦
        const name = hexagrams[Math.floor(Math.random() * 64)];
        const line = Math.floor(Math.random() * 6) + 1;

        // 2. UI反馈
        document.getElementById('result-display').style.display = 'block';
        document.getElementById('gua-name').innerText = `【${name}】`;
        document.getElementById('gua-line').innerText = `变爻：第 ${line} 爻`;

        const responseBox = document.getElementById('ai-response');
        responseBox.style.display = 'block';
        responseBox.innerHTML = '<p class="loading">正在接入高维算力进行战略解码...</p>';

        // 3. 调用 Vercel 后端
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: "你是一位精通《易经》的现代战略分析师。请结合用户摇出的卦象、爻位和他们的现实困境，给出极具深度、客观且富有洞察力的战略建议。语气需冷静、专业。请先给出该卦的微言大义，再进行场景化分析。" },
                        { role: "user", content: `卦象：${name}，变爻：第${line}爻。问题：${question}` }
                    ]
                })
            });

            const data = await response.json();
            if (response.ok) {
                // 处理 Gemini 的换行符
                const text = data.choices[0].message.content.replace(/\n/g, '<br>');
                responseBox.innerHTML = `<div>${text}</div>`;
            } else {
                const msg = data.error?.message || "服务器响应异常";
                responseBox.innerHTML = `<p style="color:red">解码中断：${msg}</p>`;
            }
        } catch (e) {
            responseBox.innerHTML = `<p style="color:red">网络连接异常，请检查云端部署。</p>`;
        }
    }
</script>

</body>
</html>
